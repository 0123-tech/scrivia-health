<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Scrivia — Be right back</title>
<meta name="description" content="Scrivia is temporarily offline for maintenance. We'll be right back."/>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232D6B4E'/><polygon points='50,13 73,52 27,52' fill='%235DC98A'/><polygon points='27,48 73,48 50,87' fill='%2342A872'/><path d='M6,50 L27,50 L34,21 L42,72 L50,50 L57,35 L64,50 L94,50' stroke='%2390DCBA' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
body{min-height:100vh;background:#0D2B1A;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
.bg-glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;pointer-events:none}
.bg-glow.a{top:-100px;right:-100px;width:400px;height:400px;background:#1B5E3C}
.bg-glow.b{bottom:-150px;left:-150px;width:500px;height:500px;background:#3DAF7A}
.wrap{position:relative;text-align:center;max-width:520px;z-index:2}
.brand{display:inline-flex;align-items:center;gap:12px;margin-bottom:48px}
.brand-mark{width:44px;height:44px;background:#1B5E3C;border-radius:11px;display:flex;align-items:center;justify-content:center}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6EC99A;background:rgba(110,201,154,.1);border:1px solid rgba(110,201,154,.25);border-radius:999px;padding:6px 14px;margin-bottom:24px}
h1{font-size:48px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-bottom:20px}
h1 span{background:linear-gradient(130deg,#6EC99A,#34D399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{font-size:17px;line-height:1.55;color:#A7D7BC;margin-bottom:36px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6EC99A;margin-right:10px;animation:pulse 1.8s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.status{display:inline-flex;align-items:center;padding:10px 18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;font-size:13px;font-weight:500;color:#C8E6C9}
.footer{margin-top:64px;font-size:12px;color:#5C8773;letter-spacing:.05em}
@media (max-width:600px){h1{font-size:36px}p{font-size:15px}}
</style>
</head>
<body>
  <div class="bg-glow a"></div>
  <div class="bg-glow b"></div>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 18 18" fill="none"><polygon points="9,2 14,9 9,16 4,9" fill="#2D7A50"/><polygon points="9,2 14,9 9,13 4,9" fill="#5EC98A"/><polygon points="9,7 14,9 9,11 4,9" fill="#A8E6C0" opacity="0.6"/><line x1="1" y1="9" x2="17" y2="9" stroke="#9EEDC0" stroke-width="0.8" opacity="0.3"/><path d="M1 9h3l1-3 2 7 1-5 1 1h9" stroke="#9EEDC0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">Scrivia</span>
    </div>
    <div class="pill">Maintenance</div>
    <h1>We'll be <span>right back.</span></h1>
    <p>Scrivia is temporarily offline while we work behind the scenes. Thanks for your patience — check back in a little while.</p>
    <div class="status"><span class="dot"></span>Service temporarily unavailable</div>
    <div class="footer">© 2026 Scrivia · We chart. You heal.</div>
  </div>
</body>
</html>
